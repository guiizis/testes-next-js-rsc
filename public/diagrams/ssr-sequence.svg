<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" viewBox="0 0 720 490" role="img" aria-labelledby="title desc">
  <title id="title">SSR: HTML gerado ao atender a requisição</title>
  <desc id="desc">O navegador solicita a página. O servidor renderiza o HTML e o devolve. O navegador exibe o conteúdo e hidrata os componentes interativos. Fluxo simplificado sem cache de resposta.</desc>
  <style>
    svg{background:#fafafa;font-family:Arial,sans-serif;color:#27272a}.panel{fill:#fff;stroke:#e4e4e7}.label{fill:#27272a;font-size:16px;font-weight:600}.muted{fill:#71717a;font-size:13px}.line{stroke:#a1a1aa;stroke-dasharray:4 6}.arrow{fill:none;stroke:#047857;stroke-width:2}.note{fill:#ecfdf5;stroke:#a7f3d0}.text{fill:#065f46;font-size:14px}.phase{fill:#f4f4f5}.tag{fill:#52525b;font-size:11px;font-weight:700;letter-spacing:1.5px}
    @media(prefers-color-scheme:dark){svg{background:#18181b;color:#e4e4e7}.panel{fill:#27272a;stroke:#3f3f46}.label{fill:#f4f4f5}.muted{fill:#a1a1aa}.phase{fill:#202023}.tag{fill:#a1a1aa}.note{fill:#052e25;stroke:#065f46}.text{fill:#a7f3d0}.arrow{stroke:#34d399}}
    .reveal{stroke-dasharray:100;stroke-dashoffset:0;animation:draw-arrow 1s ease-in-out both}.step-1{animation-delay:.4s}.step-2{animation-delay:1.6s}.step-3{animation-delay:2.8s}
    @keyframes draw-arrow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
    @media(prefers-reduced-motion:reduce){.reveal{animation:none}}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#10b981"/></marker></defs>
  <defs>
    <mask id="request" maskUnits="userSpaceOnUse" x="145" y="161" width="410" height="30"><path class="reveal step-1" d="M160 176H540" pathLength="100" fill="none" stroke="white" stroke-width="24" stroke-linecap="round"/></mask>
    <mask id="render" maskUnits="userSpaceOnUse" x="525" y="190" width="140" height="88"><path class="reveal step-2" d="M540 205H650V263H540" pathLength="100" fill="none" stroke="white" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/></mask>
    <mask id="response" maskUnits="userSpaceOnUse" x="145" y="308" width="410" height="30"><path class="reveal step-3" d="M540 323H160" pathLength="100" fill="none" stroke="white" stroke-width="24" stroke-linecap="round"/></mask>
  </defs>
  <rect class="phase" x="20" y="98" width="680" height="372" rx="12"/>
  <text class="tag" x="36" y="122">A CADA REQUISIÇÃO / SEM CACHE DE RESPOSTA</text>
  <g class="line"><path d="M160 70V448"/><path d="M540 70V448"/></g>
  <g class="panel"><rect x="70" y="22" width="180" height="48" rx="10"/><rect x="450" y="22" width="180" height="48" rx="10"/></g>
  <g class="label" text-anchor="middle"><text x="160" y="52">Navegador</text><text x="540" y="52">Servidor</text></g>
  <text class="text" x="350" y="163" text-anchor="middle">GET /pagina</text><path class="arrow" d="M160 176H540" marker-end="url(#arrow)" mask="url(#request)"/>
  <path class="arrow" d="M540 205H650V263H540" marker-end="url(#arrow)" mask="url(#render)"/>
  <rect class="note" x="420" y="219" width="198" height="36" rx="8"/><text class="text" x="519" y="242" text-anchor="middle">Renderiza o HTML</text>
  <text class="text" x="350" y="310" text-anchor="middle">HTML gerado nesta requisição</text><path class="arrow" d="M540 323H160" stroke-dasharray="6 5" marker-end="url(#arrow)" mask="url(#response)"/>
  <rect class="note" x="70" y="367" width="280" height="68" rx="10"/>
  <text class="text" x="86" y="393">Exibe o conteúdo</text><text class="muted" x="86" y="416">JS hidrata as partes interativas</text>
</svg>
