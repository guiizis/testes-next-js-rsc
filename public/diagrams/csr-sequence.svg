<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590" role="img" aria-labelledby="title desc">
  <title id="title">CSR: a interface é montada no navegador</title>
  <desc id="desc">O navegador solicita o documento e recebe o shell e o JavaScript. Depois que o JavaScript executa, o navegador faz uma requisição de dados à API, recebe a resposta e monta a interface.</desc>
  <style>
    svg{background:#fafafa;font-family:Arial,sans-serif;color:#27272a}.panel{fill:#fff;stroke:#e4e4e7}.label{fill:#27272a;font-size:16px;font-weight:600}.muted{fill:#71717a;font-size:13px}.line{stroke:#a1a1aa;stroke-dasharray:4 6}.arrow{fill:none;stroke:#047857;stroke-width:2}.note{fill:#ecfdf5;stroke:#a7f3d0}.text{fill:#065f46;font-size:14px}.phase{fill:#f4f4f5}.tag{fill:#52525b;font-size:11px;font-weight:700;letter-spacing:1.5px}
    @media(prefers-color-scheme:dark){svg{background:#18181b;color:#e4e4e7}.panel{fill:#27272a;stroke:#3f3f46}.label{fill:#f4f4f5}.muted{fill:#a1a1aa}.phase{fill:#202023}.tag{fill:#a1a1aa}.note{fill:#052e25;stroke:#065f46}.text{fill:#a7f3d0}.arrow{stroke:#34d399}}
    .reveal{stroke-dasharray:100;stroke-dashoffset:0;animation:draw-arrow 1s ease-in-out both}.step-1{animation-delay:.4s}.step-2{animation-delay:1.6s}.step-3{animation-delay:2.8s}.step-4{animation-delay:4s}
    @keyframes draw-arrow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
    @media(prefers-reduced-motion:reduce){.reveal{animation:none}}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#10b981"/></marker></defs>
  <defs>
    <mask id="document-request" maskUnits="userSpaceOnUse" x="145" y="151" width="410" height="30"><path class="reveal step-1" d="M160 166H540" pathLength="100" fill="none" stroke="white" stroke-width="24" stroke-linecap="round"/></mask>
    <mask id="document-response" maskUnits="userSpaceOnUse" x="145" y="205" width="410" height="30"><path class="reveal step-2" d="M540 220H160" pathLength="100" fill="none" stroke="white" stroke-width="24" stroke-linecap="round"/></mask>
    <mask id="data-request" maskUnits="userSpaceOnUse" x="145" y="335" width="410" height="30"><path class="reveal step-3" d="M160 350H540" pathLength="100" fill="none" stroke="white" stroke-width="24" stroke-linecap="round"/></mask>
    <mask id="data-response" maskUnits="userSpaceOnUse" x="145" y="389" width="410" height="30"><path class="reveal step-4" d="M540 404H160" pathLength="100" fill="none" stroke="white" stroke-width="24" stroke-linecap="round"/></mask>
  </defs>
  <rect class="phase" x="20" y="98" width="680" height="157" rx="12"/>
  <text class="tag" x="36" y="121">01 / DOCUMENTO E JAVASCRIPT</text>
  <rect class="phase" x="20" y="278" width="680" height="282" rx="12"/>
  <text class="tag" x="36" y="301">02 / BUSCA DE DADOS E MONTAGEM DA INTERFACE</text>
  <g class="line"><path d="M160 70V536"/><path d="M540 70V536"/></g>
  <g class="panel"><rect x="70" y="22" width="180" height="48" rx="10"/><rect x="450" y="22" width="180" height="48" rx="10"/></g>
  <g class="label" text-anchor="middle"><text x="160" y="52">Navegador</text><text x="540" y="52">Servidor / API</text></g>
  <text class="text" x="350" y="153" text-anchor="middle">GET /pagina (index.html)</text><path class="arrow" d="M160 166H540" marker-end="url(#arrow)" mask="url(#document-request)"/>
  <text class="text" x="350" y="207" text-anchor="middle">HTML + JavaScript</text><path class="arrow" d="M540 220H160" stroke-dasharray="6 5" marker-end="url(#arrow)" mask="url(#document-response)"/>
  <rect class="note" x="75" y="231" width="300" height="36" rx="8"/><text class="text" x="225" y="254" text-anchor="middle">Executa o JavaScript e monta a interface</text>
  <text class="text" x="350" y="337" text-anchor="middle">GET /api/dados</text><path class="arrow" d="M160 350H540" marker-end="url(#arrow)" mask="url(#data-request)"/>
  <text class="text" x="350" y="391" text-anchor="middle">JSON com os dados</text><path class="arrow" d="M540 404H160" stroke-dasharray="6 5" marker-end="url(#arrow)" mask="url(#data-response)"/>
  <rect class="note" x="75" y="441" width="280" height="76" rx="10"/>
  <text class="text" x="91" y="467">Monta e exibe a interface</text><text class="muted" x="91" y="491">O conteúdo depende dos dados recebidos</text>
  <text class="muted" x="390" y="462">Pode mostrar um indicador</text><text class="muted" x="390" y="483">de carregamento até a resposta.</text>
</svg>
